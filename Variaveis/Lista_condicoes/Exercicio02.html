<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Verificador de Velocidade</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <img src="imagens/exerc.jpg" alt="Velocidade" class="img-fluid">
            </div> 
                <h1>Programa Verifica Velocidade</h1>
                <form action="">
                    <p>Velocidade Permitida: <input type="number" id="inVelPermitida" min="1" required></p>
                    <p>Velocidade do Condutor: <input type="number" id="inVelCondutor" min="1" required></p>
                    <input type="submit" value="Verificar Velocidade" class="btn btn-warning">
                    <h3 id="outSituacao"></h3>
                </form>
            </div>
        </div>
    </div> 
    <script src="js/ex02.js"></script>              
</body>
</html>
