<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro JS</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <img src="imagens/exerc.jpg" alt="Simulador Parquimetro" class="img-fluid">
            </div>
                <h1>Simulador de Parquímetro</h1>
                <form action="">
                    <p>Valor R$: <input type="number" id="inValor" min="0" step="0.01" required></p>
                    <input type="submit" value="Confirmar Depósito" class="btn btn-warning">
                    <h3 id="outTempo"></h3>
                    <h3 id="outTroco"></h3>
                </form>
            </div>
        </div>
    </div> 
    <script src="js/ex03.js"></script>              
</body>
</html>
