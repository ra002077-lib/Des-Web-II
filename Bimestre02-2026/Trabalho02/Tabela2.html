<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 2 </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary fs-3 fw-normal text-uppercase">Adesão aos Cursos Pré-Congresso</h1>
        <hr class="mx-auto border-primary border-2 opacity-100 my-3" style="width: 50px;">

        <table class="table mt-4 align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col" class="text-center bg-warning text-white py-3 w-50">
                        CATEGORIA
                    </th>
                    <th scope="col" class="text-center bg-info text-white py-3 w-50">
                        VALOR DOS CURSOS
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row" class="table-light fw-normal ps-5 py-3">
                        Profissionais (inscritos no congresso)
                    </th>
                    <td class="text-center table-info py-3">R$ 80,00</td>
                </tr>
                <tr>
                    <th scope="row" class="table-light fw-normal ps-5 py-3">
                        Estudantes (inscritos no congresso)
                    </th>
                    <td class="text-center table-info py-3">R$ 60,00</td>
                </tr>
                <tr>
                    <th scope="row" class="table-light fw-normal ps-5 py-3">
                        Inscrição somente no curso<br>
                        <em>(sem adesão ao congresso)</em>
                    </th>
                    <td class="text-center table-info py-3">R$ 160,00</td>
                </tr>
            </tbody>
        </table>

        <div class="text-center mt-4">
            <a href="#" class="btn btn-success px-4 py-2 text-uppercase">Conheça nossos cursos</a>
        </div>
    </div>
    <div class="text-center text-primary fs-4 fw-normal text-uppercase mt-5">Figura 2: Tabela de Valores dos Cursos Pré-Congresso</div>
</body>
</html>
